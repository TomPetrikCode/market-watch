[project]
name = "market-watch"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
# Databricks notebooks use the global `spark`/`dbutils` – linted later
extend-exclude = ["src/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
